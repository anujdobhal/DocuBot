<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Admin Portal</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>RAG Admin Portal</h1>
      <p>Document ingestion &amp; Qdrant maintenance</p>
    </div>
    <span id="health" class="badge">Checking...</span>
  </header>

  <main class="container">
    <section class="card">
      <div class="section-title">
        <div>
          <h2>Upload document</h2>
          <p>Supported: PDF, DOCX, TXT · Max 25 MB</p>
        </div>
      </div>

      <form id="uploadForm">
        <input id="fileInput" type="file" accept=".pdf,.docx,.txt" required>
        <button type="submit">Process &amp; Store</button>
      </form>
      <div id="uploadStatus" class="status"></div>
    </section>

    <section class="stats">
      <div class="stat card">
        <span>Documents</span>
        <strong id="documentCount">—</strong>
      </div>
      <div class="stat card">
        <span>Stored chunks</span>
        <strong id="chunkCount">—</strong>
      </div>
      <div class="stat card">
        <span>Vector size</span>
        <strong id="vectorSize">—</strong>
      </div>
    </section>

    <section class="card">
      <div class="section-title">
        <div>
          <h2>Stored chunks</h2>
          <p>Live data read from the local Qdrant collection.</p>
        </div>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Filter filename or chunk text...">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Document</th>
              <th>Chunk</th>
              <th>Text</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="chunkTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
